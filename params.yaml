preprocess:
  test_size: 0.2
  random_state: 42
  min_text_length: 2

train:
  max_features: 5000
  ngram_range: [1, 2]       # Учитываем униграммы и биграммы
  c_reg: 1.0                # Коэффициент регуляризации LogisticRegression
  max_iter: 1000
  random_state: 42

evaluate:
  bot_threshold: 0.5        # Порог вероятности для отнесения к классу "Бот"